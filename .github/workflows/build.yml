name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
      PROSTOR_SIGN_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Signing certificate
        if: env.SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          "PROSTOR_SIGN_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Test and publish
        shell: pwsh
        run: ./build.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Remove certificate
        if: always() && env.PROSTOR_SIGN_PFX != ''
        shell: pwsh
        run: Remove-Item $env:PROSTOR_SIGN_PFX -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        with:
          name: prostor
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Prostor.exe
            dist/Prostor-lite.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
