name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
      PROSTOR_SIGN_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.Substring(1)
          $crate = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $crate) { throw "tag v$tag does not match Cargo.toml version $crate" }

      - name: Signing certificate
        if: env.SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          "PROSTOR_SIGN_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Test and build
        shell: pwsh
        run: ./build.ps1

      - name: Remove certificate
        if: always() && env.PROSTOR_SIGN_PFX != ''
        shell: pwsh
        run: Remove-Item $env:PROSTOR_SIGN_PFX -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        with:
          name: prostor
          path: dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Prostor.exe
            dist/Prostor-lite.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
